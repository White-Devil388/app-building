name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Official Android Scaffolding & Dependencies
        run: |
          cd flutter_app
          rm -rf android
          flutter create . --org com.drivelux --project-name drivelux_app --platforms android
          
          # Patch minSdk to 21 for video_player in both Groovy and Kotlin DSL
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/g' android/app/build.gradle || true
            echo "Patched Groovy android/app/build.gradle"
          fi
          
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled = true/g' android/app/build.gradle.kts || true
            echo "Patched Kotlin android/app/build.gradle.kts"
          fi
          
          echo "flutter.minSdkVersion=21" >> android/local.properties
          
          echo "=== APP GRADLE FILE PREVIEW ==="
          cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts 2>/dev/null
          
          flutter pub get

      - name: Build Android APK
        run: |
          cd flutter_app
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriveLux-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release with APK
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ github.run_number }}"
          name: "DriveLux Android App v1.0.${{ github.run_number }}"
          body: |
            ## DriveLux - Luxury Car Rental & Hosting (Standalone Offline Android App)
            
            Download the APK directly to your Android device to install and use.
          files: flutter_app/build/app/outputs/flutter-apk/*.apk

