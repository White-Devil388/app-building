name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Official Android Scaffolding & Dependencies
        run: |
          cd flutter_app
          rm -rf android
          flutter create . --org com.drivelux --project-name drivelux_app --platforms android
          flutter pub get

      - name: Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveLux-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
